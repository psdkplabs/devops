
name: Reusable Security Scan

"on":
  workflow_call:
    inputs:
      working-directory:
        description: Directory of the application
        required: false
        type: string
        default: "."

      run-secret-scan:
        description: Run TruffleHog secret scanning
        required: false
        type: boolean
        default: true

      run-semgrep:
        description: Run Semgrep SAST
        required: false
        type: boolean
        default: true

      run-cve:
        description: Run cve.now SCA with Bun Audit fallback
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        if: inputs.run-secret-scan
        uses: psdkplabs/devops/actions/trufflehog@main

      - name: Semgrep SAST
        if: inputs.run-semgrep
        uses: psdkplabs/devops/actions/semgrep@main

      - name: Dependency Security Scan
        if: inputs.run-cve
        uses: psdkplabs/devops/actions/dependency-scan@main
        with:
          working-directory: ${{ inputs.working-directory }}