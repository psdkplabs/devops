
name: Reusable Security Scan

"on":
  workflow_call:
    inputs:
      working-directory:
        description: Directory of the application
        required: false
        type: string
        default: "."

      run-secret-scan:
        description: Run TruffleHog secret scanning
        required: false
        type: boolean
        default: true

      run-semgrep:
        description: Run Semgrep SAST
        required: false
        type: boolean
        default: true

      run-cve:
        description: Run cve.now SCA with Bun Audit fallback
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (TruffleHog)
    if: inputs.run-secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog Secret Scan
        uses: psdkplabs/devops/actions/trufflehog@main
        with:
          path: ${{ inputs.working-directory }}

  sast:
    name: SAST Scan (Semgrep)
    if: inputs.run-semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4 # TODO: pin ke SHA
        with:
          persist-credentials: false

      - name: Semgrep SAST
        uses: psdkplabs/devops/actions/semgrep@main
        with:
          working-directory: ${{ inputs.working-directory }}

  sca:
    name: SCA (cve.now + Bun Audit)
    if: inputs.run-cve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: cve.now SCA
        uses: psdkplabs/devops/actions/dependency-scan@main
        with:
          working-directory: ${{ inputs.working-directory }}