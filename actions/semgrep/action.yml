name: Semgrep SAST Scan
description: Run reusable Semgrep security scanning

inputs:
  working-directory:
    description: Application directory
    required: false
    default: "."

  config:
    description: semgrep ruleset
    required: false
    default: "p/default"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.12"

    - name: Install Semgrep
      shell: bash
      run: python -m pip install semgrep

    - name: Run Semgrep SAST Scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SEMGREP_RULESET: ${{ inputs.config }}
      run: |
        semgrep scan \
          --config "$SEMGREP_RULESET" \
          --error \
          --metrics=off \
          .