name: Dependency CVE Scan
description: Scan for CVEs in dependencies using cve.now (fallback ke Bun Audit)

inputs:
  working-directory:
    description: Directory containing bun.lock
    required: false
    default: "."
  bun-version:
    description: Versi Bun. Harus cukup baru untuk membaca bun.lock aplikasi dan mendukung `bun audit` (>= 1.2.15)
    required: false
    default: "latest"

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Run Dependency Security Scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun "${{ github.action_path }}/../../scripts/dependency-scan.js"