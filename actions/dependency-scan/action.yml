name: Dependency CVE Scan
description: Scan for CVEs in dependencies using cve.now

inputs:
  working-directory:
    description: Directory containing bun.lock 
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2

    - name: Run Dependency Security Scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        bun "${{ github.action_path }}/../../scripts/dependency-scan.js"
